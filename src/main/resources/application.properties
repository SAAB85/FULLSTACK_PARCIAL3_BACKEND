spring.application.name=ep3-backend
server.port=8080

# Base de datos H2 en archivo: los datos sobreviven al reinicio.
spring.datasource.url=jdbc:h2:file:./data/ep3db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 (solo para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: en producción definir JWT_SECRET con al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:dev-secret-key-cambiar-en-produccion-1234567890}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:7200000}

# Orígenes permitidos para el frontend (CORS)
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}
